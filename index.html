<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishaal Mohamed KK | Developer & Animator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2962FF;
            --secondary: #AA00FF;
            --accent1: #00C853;
            --accent2: #FF6D00;
            --dark: #121212;
            --light: #f8f9fa;
            --gray: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent1);
        }

        .navbar {
            display: flex;
            gap: 2rem;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: 0.3s;
            position: relative;
        }

        .navbar a:hover {
            color: var(--accent1);
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent1);
            transition: 0.3s;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .social-icons {
            display: flex;
            gap: 1rem;
        }

        .social-icons a {
            color: white;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--accent1);
            transform: translateY(-3px);
        }

        .menu-toggle {
            display: none;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)), 
                        url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') no-repeat center/cover;
            background-attachment: fixed;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-content h1 span {
            color: var(--primary);
        }

        .hero-content .typing-text {
            font-size: 1.5rem;
            color: var(--gray);
            margin-bottom: 1.5rem;
            height: 2rem;
        }

        .hero-content p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(41, 98, 255, 0.3);
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(170, 0, 255, 0.4);
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Skills Section */
        .skills {
            padding: 5rem 5%;
            background-color: white;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .section-title p {
            color: var(--gray);
            max-width: 700px;
            margin: 0 auto;
        }

        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .skill-item {
            background-color: var(--light);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .skill-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .skill-item i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .skill-item h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        /* About Section */
        .about {
            padding: 5rem 5%;
            background-color: var(--light);
        }

        .about-container {
            display: flex;
            align-items: center;
            gap: 3rem;
            margin-top: 3rem;
        }

        .about-image {
            flex: 1;
            position: relative;
        }

        .about-image img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .about-content {
            flex: 1;
        }

        .about-content h3 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--dark);
        }

        .about-content p {
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: var(--gray);
        }

        .education {
            margin-top: 2rem;
        }

        .education-item {
            margin-bottom: 1.5rem;
            position: relative;
            padding-left: 2rem;
        }

        .education-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            width: 15px;
            height: 15px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .education-item h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .education-item p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Portfolio Section */
        .portfolio {
            padding: 5rem 5%;
            background-color: white;
        }

        .portfolio-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .portfolio-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .portfolio-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .portfolio-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(41, 98, 255, 0.9), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            opacity: 0;
            transition: 0.3s;
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
        }

        .portfolio-overlay h3 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .portfolio-overlay p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
        }

        .portfolio-overlay a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Services Section */
        .services {
            padding: 5rem 5%;
            background-color: var(--light);
        }

        .services-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-item {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }

        .service-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .service-item i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .service-item h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .service-item p {
            color: var(--gray);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        /* Contact Section */
        .contact {
            padding: 5rem 5%;
            background-color: white;
        }

        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            margin-top: 3rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .contact-info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .contact-info-item i {
            font-size: 1.5rem;
            color: var(--primary);
            width: 50px;
            height: 50px;
            background-color: rgba(41, 98, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-info-item div h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .contact-info-item div p {
            color: var(--gray);
        }

        .contact-form {
            background-color: var(--light);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        .contact-info a {
    color: var(--gray);
    text-decoration: none;
    transition: color 0.3s;
}

.contact-info a:hover {
    color: var(--primary);
    text-decoration: underline;
}

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.2);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: white;
            padding: 3rem 5%;
            text-align: center;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .footer-logo {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .footer-logo span {
            color: var(--accent1);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: var(--accent1);
        }

        .footer-social {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .footer-social a {
            color: white;
            font-size: 1.5rem;
            transition: 0.3s;
        }

        .footer-social a:hover {
            color: var(--accent1);
            transform: translateY(-3px);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 8rem;
                padding-bottom: 3rem;
            }

            .hero-content {
                margin-bottom: 3rem;
            }

            .about-container {
                flex-direction: column;
            }

            .about-image {
                margin-bottom: 2rem;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .navbar {
                position: fixed;
                top: 80px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 80px);
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                flex-direction: column;
                align-items: center;
                padding-top: 3rem;
                transition: 0.3s;
            }

            .navbar.active {
                left: 0;
            }

            .social-icons {
                display: none;
            }

            .hero-content h1 {
                font-size: 2.5rem;
            }

            .section-title h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 576px) {
            .hero-content h1 {
                font-size: 2rem;
            }

            .btn {
                padding: 0.6rem 1.5rem;
            }
        }
        .store-features {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 1rem 0;
}

.store-features span {
    background: rgba(0, 200, 83, 0.1);

    padding: 0.3rem 0.8rem;
    border-radius: 50px;

    display: flex;
    align-items: center;

}

.store-features i {
    color: var(--accent1);

}

.business-highlight {

.business-highlight {

}

.highlight-container {

}

}

    list-style: none;

}

.store-features i {
    color: var(--accent1);
}

.cta-buttons {
    display: flex;

    margin-top: 2rem;
}

.btn-primary {

}

.btn-outline {

}

/* Responsive */
@media (max-width: 768px) {
    .highlight-container {
        flex-direction: column;
    }
    .highlight-content {
        text-align: center;
    }
    .store-features li {
        justify-content: center;
    }
    .cta-buttons {
        justify-content: center;
    }
}
/* Improved Mobile Menu Styles */
@media (max-width: 768px) {
    .navbar {
        position: fixed;
        top: 80px;
        left: -100%;
        width: 100%;
        height: calc(100vh - 80px);

        flex-direction: column;
        align-items: center;
        padding-top: 3rem;
        transition: 0.3s;
        z-index: 999;
    }

    .navbar.active {
        left: 0;
    }

    .navbar a {
        padding: 1rem 0;

    }

    .menu-toggle {
        display: block;
        z-index: 1001;
    }

    .social-icons {
        display: none;
    }
}

/* Prevent horizontal scrolling */
html, body {
    max-width: 100%;
    overflow-x: hidden;
}

/* Better form status messages */
#form-status {
    margin-top: 1rem;
    padding: 0.8rem;
    border-radius: 5px;
    font-size: 0.9rem;
}

#form-status div {
    padding: 0.5rem;
}
/* Coding Education Section - Enhanced */
.coding-education {
    padding: 5rem 5%;
    background-color: white;
    position: relative;
}

.education-container {
    display: flex;
    align-items: center;
    gap: 3rem;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
}

.education-image {
    flex: 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    position: relative;
}

.platform-badge {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.9);
    padding: 0.8rem 1.2rem;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(5px);
}

.platform-logo {
    width: 30px;
    height: 30px;
    object-fit: contain;
}

.education-content {
    flex: 1;
}

.education-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1.5rem;
}

.rating {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
}

.stars {
    color: var(--accent2);
}

.cta-buttons {
    display: flex;
    gap: 1rem;
}

.testimonial-btn {
    background: var(--light);
    color: var(--primary);
    border: 2px solid var(--primary);
}

.testimonial-btn:hover {
    background: var(--primary);
    color: white;
}

.experience-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(41, 98, 255, 0.05);
    padding: 1.5rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
}

.experience-card i {
    font-size: 2rem;
    color: var(--primary);
}

.experience-card h4 {
    margin-bottom: 0.3rem;
    color: var(--dark);
}

.highlight {
    font-size: 1.1rem;
    line-height: 1.7;
    color: var(--dark);
    margin: 1.5rem 0;
    padding-left: 1rem;
    border-left: 3px solid var(--primary);
}

.key-benefits {
    margin: 2rem 0;
}

.benefit {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    margin-bottom: 1rem;
}

.benefit i {
    color: var(--accent1);
    margin-top: 0.2rem;
}

/* Testimonial Modal */
.testimonial-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: white;
    padding: 2rem;
    border-radius: 10px;
    max-width: 800px;
    width: 90%;
    position: relative;
    animation: modalFadeIn 0.3s ease-out;
}

.close-modal {
    position: absolute;
    top: 1rem;
    right: 1.5rem;
    font-size: 2rem;
    cursor: pointer;
    color: var(--gray);
}

.video-container {
    position: relative;
    padding-bottom: 56.25%;
    margin: 1.5rem 0;
    height: 0;
    overflow: hidden;
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

@keyframes modalFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 992px) {
    .education-container {
        flex-direction: column;
    }
    
    .education-image {
        width: 100%;
    }
    
    .cta-buttons {
        flex-direction: column;
        width: 100%;
    }
    
    .cta-buttons .btn {
        width: 100%;
        text-align: center;
    }
}
</head>

        <div class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
        
        <div class="social-icons">

        </div>

    <script>
// Typing Animation
const typingText = document.querySelector('.typing-text');
const texts = ["Web Developer", "Animator", "Designer", "Student"];
let textIndex = 0;
let charIndex = 0;
let isDeleting = false;
let typingSpeed = 100;

function type() {
    const currentText = texts[textIndex];
    if (isDeleting) {
        typingText.textContent = currentText.substring(0, charIndex - 1);
        charIndex--;
        typingSpeed = 50;
    } else {
        typingText.textContent = currentText.substring(0, charIndex + 1);
        charIndex++;
        typingSpeed = 100;
    }

    if (!isDeleting && charIndex === currentText.length) {
        isDeleting = true;
        typingSpeed = 1500;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        typingSpeed = 500;
    }

    setTimeout(type, typingSpeed);
}

// Start typing animation
setTimeout(type, 1000);

// Mobile Menu Toggle - Fixed Version
const menuToggle = document.querySelector('.menu-toggle');
const navbar = document.querySelector('.navbar');

menuToggle.addEventListener('click', () => {
    navbar.classList.toggle('active');
    menuToggle.querySelector('i').className = navbar.classList.contains('active') 
        ? 'fas fa-times' 
        : 'fas fa-bars';
});

// Close menu when clicking a link
document.querySelectorAll('.navbar a').forEach(link => {
    link.addEventListener('click', () => {
        navbar.classList.remove('active');
        menuToggle.querySelector('i').className = 'fas fa-bars';
    });
});

// Smooth scrolling for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            window.scrollTo({
                top: target.offsetTop - 80, // Adjust for fixed header
                behavior: 'smooth'
            });
            
            // Close mobile menu if open
            if (navbar.classList.contains('active')) {
                navbar.classList.remove('active');
                menuToggle.querySelector('i').className = 'fas fa-bars';
            }
        }
    });
});

// Form submission with Formspree
const contactForm = document.getElementById('contactForm');
const submitBtn = document.getElementById('submitBtn');
const formStatus = document.getElementById('form-status');

if (contactForm) {
    contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Change button text and disable it
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;
        
        try {
            const formData = new FormData(contactForm);
            const response = await fetch(contactForm.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (response.ok) {
                formStatus.innerHTML = '<div style="color: var(--accent1);">Thank you! Your message has been sent successfully.</div>';
                contactForm.reset();
            } else {
                const data = await response.json();
                if (data.errors) {
                    formStatus.innerHTML = `<div style="color: var(--accent2);">Error: ${data.errors.map(error => error.message).join(', ')}</div>`;
                } else {
                    formStatus.innerHTML = '<div style="color: var(--accent2);">Oops! There was a problem submitting your form. Please try again.</div>';
                }
            }
        } catch (error) {
            formStatus.innerHTML = '<div style="color: var(--accent2);">Oops! There was a problem submitting your form. Please try again.</div>';
        } finally {
            submitBtn.textContent = 'Send Message';
            submitBtn.disabled = false;
            
            // Hide status message after 5 seconds
            setTimeout(() => {
                formStatus.innerHTML = '';
            }, 5000);
        }
    });
}

// Scroll animation for sections
window.addEventListener('scroll', function() {
    const sections = document.querySelectorAll('section');
    const scrollPosition = window.scrollY + window.innerHeight;
    
    sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        
        if (scrollPosition > sectionTop + sectionHeight * 0.3) {
            section.style.opacity = '1';
            section.style.transform = 'translateY(0)';
        }
    });
});

// Initialize sections with fade-in effect
document.querySelectorAll('section').forEach(section => {
    section.style.opacity = '0';
    section.style.transform = 'translateY(50px)';
    section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
});

// Trigger initial animation for hero section
document.querySelector('.hero').style.opacity = '1';
document.querySelector('.hero').style.transform = 'translateY(0)';
document.addEventListener('DOMContentLoaded', function() {
    // Skills Data
    const skillsData = [
        { icon: 'fa-laptop-code', name: 'Web Development', color: '#2962FF' },
        { icon: 'fa-paint-brush', name: 'UI/UX Design', color: '#AA00FF' },
        { icon: 'fa-js', name: 'JavaScript', color: '#F7DF1E' },
        { icon: 'fa-python', name: 'Python', color: '#3776AB' },
        { icon: 'fa-database', name: 'Database Design', color: '#FF6D00' },
        { icon: 'fa-mobile-alt', name: 'Responsive Design', color: '#00C853' },
        { icon: 'fa-code-branch', name: 'Version Control', color: '#F05133' },
        { icon: 'fa-server', name: 'Backend Basics', color: '#5E35B1' }
    ];

    // Populate skills grid
    const skillsGrid = document.getElementById('skillsGrid');
    skillsData.forEach(skill => {
        const skillBadge = document.createElement('div');
        skillBadge.className = 'skill-badge';
        skillBadge.innerHTML = `
            <i class="fas ${skill.icon}" style="color: ${skill.color}"></i> 
            ${skill.name}
        `;
        skillBadge.style.borderLeft = `3px solid ${skill.color}`;
        skillsGrid.appendChild(skillBadge);
    });

    // Testimonial Modal
    const testimonialBtn = document.getElementById('testimonialBtn');
    const testimonialModal = document.getElementById('testimonialModal');
    const closeModal = document.getElementById('closeModal');

    if (testimonialBtn && testimonialModal) {
        testimonialBtn.addEventListener('click', () => {
            testimonialModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });

        closeModal.addEventListener('click', () => {
            testimonialModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        });

        window.addEventListener('click', (e) => {
            if (e.target === testimonialModal) {
                testimonialModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });
    }

    // Logo hover effect
    const stypeLogo = document.getElementById('stypeLogo');
    if (stypeLogo) {
        stypeLogo.addEventListener('mouseenter', () => {
            stypeLogo.style.transform = 'scale(1.1) rotate(5deg)';
        });
        stypeLogo.addEventListener('mouseleave', () => {
            stypeLogo.style.transform = 'scale(1) rotate(0)';
        });
    }

    // Animate skills on scroll
    const animateSkills = () => {
        const skills = document.querySelectorAll('.skill-badge');
        skills.forEach((skill, index) => {
            setTimeout(() => {
                skill.style.opacity = '1';
                skill.style.transform = 'translateY(0)';
            }, 100 * index);
        });
    };

    // Intersection Observer for skills animation
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                animateSkills();
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    if (skillsGrid) {
        observer.observe(skillsGrid);
        
        // Initialize hidden state
        document.querySelectorAll('.skill-badge').forEach(skill => {
            skill.style.opacity = '0';
            skill.style.transform = 'translateY(20px)';
            skill.style.transition = 'all 0.5s ease-out';
        });
    }
});
    </script>
